<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Synapse Canvas</title>
    <script>
      // Runs before first paint, so a dark-theme user never sees a white flash
      // while React boots, and so `lang` is right before any assistive tech or
      // translate prompt reads it. Mirrors src/hooks/useTheme.tsx and
      // src/hooks/useI18n.tsx; the storage keys have to match.
      (function () {
        try {
          var locale = localStorage.getItem('synapse.locale');
          if (locale !== 'en' && locale !== 'ru') {
            locale = (navigator.language || '').toLowerCase().indexOf('ru') === 0
              ? 'ru'
              : 'en';
          }
          document.documentElement.lang = locale;

          var stored = localStorage.getItem('synapse.theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
