<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Synapse Canvas">
  <style>
    /* Mirrors --accent / --accent-contrast in src/styles.css, so the tile
       tracks the OS theme in browsers that support SVG favicons. */
    .tile { fill: #5a54e8; }
    .mark { stroke: #ffffff; fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #8b84ff; }
      .mark { stroke: #0c0c16; fill: #0c0c16; }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="7.5" />
  <g class="mark">
    <path d="M16 16 9.5 10.3M16 16 23 11M16 16 17.2 23.8" stroke-width="1.9"
          stroke-linecap="round" fill="none" opacity=".6" />
    <circle cx="9.5" cy="10.3" r="2.1" />
    <circle cx="23" cy="11" r="2.1" />
    <circle cx="17.2" cy="23.8" r="2.1" />
    <circle cx="16" cy="16" r="3.5" />
  </g>
</svg>
