# Serves the built client and proxies the API onto the same origin, so the
# browser makes no cross-origin request and CORS is not involved at all in the
# container setup. It also keeps the API's host and port out of the bundle,
# which matters because Vite inlines them at build time.

# Required by the Upgrade header below; `map` belongs to http context, and
# conf.d is included from there.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml;

    location /api/ {
        # Resolve through Docker's embedded DNS at request time. A literal
        # upstream is resolved once at startup, so the api container coming
        # back on a new address would leave nginx proxying into a void.
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $api_upstream http://api:8000;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwritten, not appended: appending would let a client prepend its
        # own value, and the API reads the first hop. Only an overwriting proxy
        # makes TRUST_PROXY_HEADERS safe to turn on.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ready for Part 3's WebSocket; inert for ordinary requests.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 75s;
    }

    # Filenames are content-hashed, so these can never go stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The one file that must not be cached, or a rebuild stays invisible.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Client-side routing: /workspaces/:id/documents/:id is not a file on disk,
    # so anything unmatched falls back to the app shell rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
