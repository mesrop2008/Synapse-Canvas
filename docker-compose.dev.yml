# Opt-in overlay: publishes Postgres, Redis and the API to the host, for running
# pytest, alembic, uvicorn or the Vite dev server outside the containers.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Or once, in .env, so every `docker compose` command includes it:
#   COMPOSE_PATH_SEPARATOR=:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml
#
# Not part of the default stack because each published port is one more thing
# that can already be taken on someone's machine, and the app itself needs none
# of them. Bound to 127.0.0.1: the database has a default password, and nothing
# outside this machine should be able to reach it.
#
# A port already in use? Set POSTGRES_PORT / REDIS_PORT / API_PORT in .env, and
# update DATABASE_URL / TEST_DATABASE_URL / REDIS_URL to the same port.

services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6381}:6379"

  api:
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
