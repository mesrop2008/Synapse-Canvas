# `docker compose up -d --build`, then open http://localhost:5173 (WEB_PORT).
#
# Only the web port is published, so the stack starts even when the host
# already uses 5432/6379/8000. docker-compose.dev.yml publishes the rest for
# host-side tests and tools.

x-app-environment: &app-environment
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-synapse}:${POSTGRES_PASSWORD:-synapse}@postgres:5432/${POSTGRES_DB:-synapse_canvas}
  REDIS_URL: redis://redis:6379/0
  ENVIRONMENT: ${ENVIRONMENT:-local}
  DEBUG: ${DEBUG:-false}
  # Empty: the entrypoint generates one for local/test.
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
  PREVIOUS_JWT_SECRET_KEYS: ${PREVIOUS_JWT_SECRET_KEYS:-}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
  BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Synapse Canvas}
  EMAIL_VERIFICATION_CODE_TTL_SECONDS: ${EMAIL_VERIFICATION_CODE_TTL_SECONDS:-300}
  EMAIL_VERIFICATION_MAX_ATTEMPTS: ${EMAIL_VERIFICATION_MAX_ATTEMPTS:-5}
  EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS: ${EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:-60}

x-app-build: &app-build
  context: .
  target: runtime
  args:
    PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13-slim}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-mirror.gcr.io/library/postgres:15-alpine}
    container_name: synapse_canvas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synapse}
      POSTGRES_DB: ${POSTGRES_DB:-synapse_canvas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synapse} -d ${POSTGRES_DB:-synapse_canvas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Holds nothing durable, so no volume and no persistence.
  redis:
    image: ${REDIS_IMAGE:-mirror.gcr.io/library/redis:7-alpine}
    container_name: synapse_canvas_redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot; "Exited (0)" is success. Separate so replicas never race migrations.
  migrate:
    build: *app-build
    image: synapse-canvas-api:local
    container_name: synapse_canvas_migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment: *app-environment
    volumes:
      - ./alembic:/app/alembic:ro
      - ./api:/app/api:ro
      - jwt_secret:/var/lib/synapse
    command: alembic upgrade head
    restart: "no"

  api:
    build: *app-build
    image: synapse-canvas-api:local
    container_name: synapse_canvas_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *app-environment
    volumes:
      # Dev only: live reload. Drop these mounts and --reload in production.
      - ./api:/app/api:ro
      - ./alembic:/app/alembic:ro
      - jwt_secret:/var/lib/synapse
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  # A static build: rebuild with `docker compose up -d --build web`.
  web:
    build:
      context: ./web
      args:
        NODE_IMAGE: ${NODE_IMAGE:-mirror.gcr.io/library/node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-mirror.gcr.io/library/nginx:1.27-alpine}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    image: synapse-canvas-web:local
    container_name: synapse_canvas_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:80"

volumes:
  postgres_data:
  jwt_secret:
