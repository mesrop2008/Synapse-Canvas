# Local stack: PostgreSQL, a one-shot migration job, the API, and the client.
#
# `docker compose up -d --build` brings the whole thing up in order:
#   postgres (healthcheck) -> migrate (to completion) -> api (healthcheck) -> web
#
# Open http://localhost:5173. The web container serves the built client and
# proxies /api to the API on the same origin, so the browser never makes a
# cross-origin request and the API's address is not baked into the bundle.
#
# Postgres is published on host port 5433 by default so it can run alongside a
# natively installed server already holding 5432. Inside the compose network
# the API reaches it as `postgres:5432`, which is why the two DATABASE_URLs in
# .env.example differ by host and port.

# Shared by `migrate` and `api` so the two cannot drift apart.
x-app-environment: &app-environment
  # Overrides whatever .env says: inside the network the database is
  # `postgres:5432`, never localhost.
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-synapse}:${POSTGRES_PASSWORD:-synapse}@postgres:5432/${POSTGRES_DB:-synapse_canvas}
  ENVIRONMENT: ${ENVIRONMENT:-local}
  DEBUG: ${DEBUG:-false}
  # Left empty on purpose: the entrypoint generates and persists a key for
  # local/test on first run, so the stack needs no setup. Any other
  # ENVIRONMENT refuses to start without one.
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
  PREVIOUS_JWT_SECRET_KEYS: ${PREVIOUS_JWT_SECRET_KEYS:-}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
  BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  EMAIL_VERIFICATION_LINK_BASE: ${EMAIL_VERIFICATION_LINK_BASE:-http://localhost:5173/verify-email}

x-app-build: &app-build
  context: .
  target: runtime
  args:
    PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13-slim}

services:
  postgres:
    # Pulled through the same mirror as the API base image, for the same
    # reason. Override POSTGRES_IMAGE to track a different major version or to
    # pull direct from Docker Hub.
    image: ${POSTGRES_IMAGE:-mirror.gcr.io/library/postgres:15-alpine}
    container_name: synapse_canvas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synapse}
      POSTGRES_DB: ${POSTGRES_DB:-synapse_canvas}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synapse} -d ${POSTGRES_DB:-synapse_canvas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs to completion, then exits 0. `api` waits on that exit rather than
  # running migrations itself: with more than one replica, every one of them
  # would race the same ALTERs on boot. Seeing this container as "Exited (0)"
  # after startup is the success case, not a crash.
  migrate:
    build: *app-build
    image: synapse-canvas-api:local
    container_name: synapse_canvas_migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment: *app-environment
    volumes:
      - ./alembic:/app/alembic:ro
      - ./api:/app/api:ro
      - jwt_secret:/var/lib/synapse
    command: alembic upgrade head
    restart: "no"

  api:
    build: *app-build
    image: synapse-canvas-api:local
    container_name: synapse_canvas_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *app-environment
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Development convenience: edit on the host, uvicorn reloads in the
      # container. Drop both mounts and --reload for a real deployment, where
      # the image should be immutable.
      - ./api:/app/api:ro
      - ./alembic:/app/alembic:ro
      - jwt_secret:/var/lib/synapse
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  # Static build behind nginx, not the Vite dev server: one command should give
  # a working app, and HMR is better served by running `npm run dev` on the host
  # against this same API. Rebuild with `docker compose up -d --build web` after
  # changing client source -- there is no bind mount, on purpose, because the
  # image contains compiled output rather than source.
  web:
    build:
      context: ./web
      args:
        NODE_IMAGE: ${NODE_IMAGE:-mirror.gcr.io/library/node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-mirror.gcr.io/library/nginx:1.27-alpine}
        # Same-origin path handled by the container's own nginx.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    image: synapse-canvas-web:local
    container_name: synapse_canvas_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:80"

volumes:
  postgres_data:
  # Holds the development signing key so it survives restarts and both
  # services see the same one.
  jwt_secret:
